name: AUTH-029 roadmap finalize

on:
  push:
    branches:
      - auth-029-authentication-architecture-secret-guardrails

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-029-authentication-architecture-secret-guardrails
          fetch-depth: 0
      - name: Finalize AUTH-029 roadmap
        shell: bash
        run: |
          python .github/auth-029-finalize.py
          git rm .github/auth-029-finalize.py .github/workflows/auth-029-roadmap-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/authentication.md
          git commit -m "test(authentication): add authentication architecture and secret guardrails"
          git push origin HEAD:auth-029-authentication-architecture-secret-guardrails

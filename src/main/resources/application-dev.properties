# =====================================================================
# HidraAPI - Development profile
# Activate with:
#   SPRING_PROFILES_ACTIVE=dev
# =====================================================================

spring.config.activate.on-profile=dev

# ---------------------------------------------------------------------
# Datasource / JPA
# ---------------------------------------------------------------------
spring.datasource.url=${HIDRA_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hidra_dev}
spring.datasource.username=${HIDRA_DATASOURCE_USERNAME:hidra}
spring.datasource.password=${HIDRA_DATASOURCE_PASSWORD:hidra}
spring.datasource.hikari.pool-name=HidraDevHikariPool
spring.datasource.hikari.maximum-pool-size=${HIDRA_DATASOURCE_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIDRA_DATASOURCE_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.dz.sh.hidra=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------------------------------------------------------------------
# OpenAPI
# ---------------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ---------------------------------------------------------------------
# Hidra custom properties
# ---------------------------------------------------------------------
hidra.environment=dev
hidra.platform.security.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
hidra.platform.events.outbox.cleanup-enabled=false
hidra.api.errors.include-debug-details=true

# ---------------------------------------------------------------------
# Security bootstrap credentials
# ---------------------------------------------------------------------
hidra.security.bootstrap.username=${HIDRA_SECURITY_BOOTSTRAP_USERNAME:hidra-admin}
hidra.security.bootstrap.password=${HIDRA_SECURITY_BOOTSTRAP_PASSWORD:hidra-dev-change-me}
hidra.security.bootstrap.roles=${HIDRA_SECURITY_BOOTSTRAP_ROLES:HIDRA_ADMIN}
hidra.platform.security.authentication-mode=${HIDRA_SECURITY_AUTHENTICATION_MODE:basic}
hidra.platform.security.jwt.hmac-secret=${HIDRA_JWT_HMAC_SECRET:hidra-dev-jwt-secret-change-me-please-32-bytes-minimum}
hidra.platform.security.jwt.audience=${HIDRA_JWT_AUDIENCE:hidra-api}

# ---------------------------------------------------------------------
# Notification asynchronous push
# ---------------------------------------------------------------------
hidra.notification.async-push.enabled=${HIDRA_NOTIFICATION_ASYNC_PUSH_ENABLED:true}
hidra.notification.async-push.core-pool-size=${HIDRA_NOTIFICATION_ASYNC_PUSH_CORE_POOL_SIZE:4}
hidra.notification.async-push.max-pool-size=${HIDRA_NOTIFICATION_ASYNC_PUSH_MAX_POOL_SIZE:12}
hidra.notification.async-push.queue-capacity=${HIDRA_NOTIFICATION_ASYNC_PUSH_QUEUE_CAPACITY:500}
hidra.notification.async-push.thread-name-prefix=${HIDRA_NOTIFICATION_ASYNC_PUSH_THREAD_PREFIX:HidraNotificationPush-}
hidra.notification.push.provider-reference=${HIDRA_NOTIFICATION_PUSH_PROVIDER_REFERENCE:hidra-local-async-push}

# =====================================================================
# HidraAPI - Test profile
# Used by STB-010 bootstrap smoke tests.
# =====================================================================

spring.config.activate.on-profile=test

# ---------------------------------------------------------------------
# Datasource / JPA
# Datasource URL, username, password, and driver are supplied dynamically
# by HidraApplicationTests through PostgreSQL Testcontainers.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------------
# Server / Actuator
# ---------------------------------------------------------------------
server.port=0
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.dz.sh.hidra=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ---------------------------------------------------------------------
# Hidra custom properties
# ---------------------------------------------------------------------
hidra.environment=test
hidra.api.errors.include-debug-details=true

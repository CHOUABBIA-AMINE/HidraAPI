name: HidraAPI CI
# HIDRA_CI_FORMAT: partition-shadow-v1
# Mandatory unrestricted fallback; optimized adoption remains disabled.
'on':
  push:
    branches:
    - main
    paths-ignore:
    - doc/**
    - docs/**
    - '**/*.md'
  pull_request:
    branches:
    - main
    paths-ignore:
    - doc/**
    - docs/**
    - '**/*.md'
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: hidraapi-ci-${{ github.sha }}
  cancel-in-progress: false
jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Test canonical documentation validators
      run: |
        python3 .github/scripts/test_validate_docs.py
        python3 .github/scripts/test_validate_openapi_snapshot.py
        python3 .github/scripts/test_generate_data_dictionary.py
        python3 .github/scripts/test_resolve_openapi_base.py
        python3 .github/scripts/test_verify_ci_test_inventory.py
        python3 .github/scripts/test_verify_full_ci_evidence.py
    - name: Validate canonical documentation and OpenAPI snapshot
      run: |
        python3 .github/scripts/validate_docs.py
        python3 .github/scripts/validate_openapi_snapshot.py
    - name: Validate P1 survivability closure evidence
      shell: bash
      run: python3 .github/scripts/validate_p1_closure.py
    - name: Validate production application HA runtime artifacts
      run: bash ops/production/scripts/validate-runtime-artifacts.sh
    - name: Validate production PostgreSQL HA artifacts
      run: bash ops/production/postgres/scripts/validate-postgres-ha-artifacts.sh
    - name: Validate production pgBackRest backup/PITR artifacts
      run: bash ops/production/postgres/scripts/validate-backup-pitr-artifacts.sh
    - name: Validate controlled release artifacts
      run: bash ops/production/release/validate-release-artifacts.sh
    - name: Validate production observability artifacts
      run: bash ops/production/observability/validate-observability-artifacts.sh
    - name: Validate database operations procedures
      run: bash ops/production/postgres/scripts/validate-database-operations.sh
    - name: Validate exact source inventory
      run: python3 .github/scripts/verify_ci_test_inventory.py
    - name: Seal source and runtime evidence
      run: python3 .github/scripts/verify_full_ci_evidence.py stamp --kind static-validation --output target/ci/static-validation/evidence.json
    - name: Retain lane evidence and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hidra-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-static-validation
        path: target/ci/static-validation/
        if-no-files-found: error
        retention-days: 14
  unit-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Ensure Maven wrapper is executable
      run: chmod +x mvnw
    - name: Verify exact source selection
      id: selection
      shell: bash
      run: |
        set -euo pipefail
        classes="$(python3 .github/scripts/verify_ci_test_inventory.py --select unit-architecture)"
        echo "classes=${classes}" >> "$GITHUB_OUTPUT"
    - name: Selected clean verify lifecycle
      env:
        CI_TEST_CLASSES: ${{ steps.selection.outputs.classes }}
      run: bash ./mvnw -B -q clean verify -DforkCount=1 -DreuseForks=true "-Dtest=${CI_TEST_CLASSES}"
    - name: Require every selected raw test report
      if: always()
      run: python3 .github/scripts/verify_ci_test_inventory.py --select unit-architecture --reports target/surefire-reports --evidence target/ci/unit-architecture/evidence.json
    - name: Retain lane evidence and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hidra-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-unit-architecture
        path: target/ci/unit-architecture/
        if-no-files-found: error
        retention-days: 14
    - name: Retain raw failure logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hidra-ci-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-unit-architecture
        path: |-
          target/surefire-reports/
          target/openapi/
          target/database/
        if-no-files-found: warn
        retention-days: 14
    name: Java 21 unit and architecture
    env:
      DOCKER_HOST: unix:///hidra-unit-no-docker.sock
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Ensure Maven wrapper is executable
      run: chmod +x mvnw
    - name: Verify exact source selection
      id: selection
      shell: bash
      run: |
        set -euo pipefail
        classes="$(python3 .github/scripts/verify_ci_test_inventory.py --select postgres-${{ matrix.shard }})"
        echo "classes=${classes}" >> "$GITHUB_OUTPUT"
    - name: Selected clean verify lifecycle
      env:
        CI_TEST_CLASSES: ${{ steps.selection.outputs.classes }}
      run: bash ./mvnw -B -q clean verify -DforkCount=1 -DreuseForks=true "-Dtest=${CI_TEST_CLASSES}"
    - name: Require every selected raw test report
      if: always()
      run: python3 .github/scripts/verify_ci_test_inventory.py --select postgres-${{ matrix.shard }} --reports target/surefire-reports --evidence target/ci/postgres-${{ matrix.shard }}/evidence.json
    - name: Retain lane evidence and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hidra-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-postgres-${{ matrix.shard }}
        path: target/ci/postgres-${{ matrix.shard }}/
        if-no-files-found: error
        retention-days: 14
    - name: Retain raw failure logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hidra-ci-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-postgres-${{ matrix.shard }}
        path: |-
          target/surefire-reports/
          target/openapi/
          target/database/
        if-no-files-found: warn
        retention-days: 14
    name: PostgreSQL integration shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
  api-contract:
    name: API contract and dictionary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hidra_test
          POSTGRES_USER: hidra
          POSTGRES_PASSWORD: hidra
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U hidra -d hidra_test" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Ensure Maven wrapper is executable
      run: chmod +x mvnw
    - name: Build current contract application; test lanes own verification
      run: bash ./mvnw -B -q clean package -Dmaven.test.skip=true
    - name: Publish deterministic OpenAPI contract
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p target/openapi
        APP_JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
        if [ -z "${APP_JAR}" ]; then
          echo "No executable application jar found after verify." >&2
          exit 1
        fi
        SPRING_PROFILES_ACTIVE=test \
        SPRINGDOC_API_DOCS_ENABLED=true \
        SPRINGDOC_SWAGGER_UI_ENABLED=false \
        SERVER_PORT=8080 \
        MANAGEMENT_SERVER_PORT=8080 \
        java -jar "${APP_JAR}" > target/openapi/application.log 2>&1 &
        APP_PID=$!
        trap 'kill ${APP_PID} 2>/dev/null || true' EXIT
        for attempt in $(seq 1 60); do
          if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
            break
          fi
          if ! kill -0 "${APP_PID}" 2>/dev/null; then
            cat target/openapi/application.log >&2
            exit 1
          fi
          if [ "${attempt}" -eq 60 ]; then
            cat target/openapi/application.log >&2
            exit 1
          fi
          sleep 2
        done
        curl --fail --silent http://127.0.0.1:8080/v3/api-docs > target/openapi/hidra-api.json
        python3 - <<'PY'
        import json
        from pathlib import Path

        path = Path('target/openapi/hidra-api.json')
        payload = json.loads(path.read_text(encoding='utf-8'))

        schemes = payload.get('components', {}).get('securitySchemes', {})
        required_schemes = {'hidraBearerJwt', 'externalOidcBearerJwt'}
        missing_schemes = sorted(required_schemes - set(schemes))
        if missing_schemes:
            raise SystemExit(f"Missing OpenAPI security schemes: {missing_schemes}")

        for name in ('hidraBearerJwt', 'externalOidcBearerJwt'):
            scheme = schemes[name]
            if scheme.get('type') != 'http' or scheme.get('scheme') != 'bearer' or scheme.get('bearerFormat') != 'JWT':
                raise SystemExit(f"Invalid bearer security scheme {name}: {scheme}")

        paths = payload.get('paths', {})

        workbench_modules = paths.get('/api/v1/workbench/modules', {}).get('get')
        if not workbench_modules:
            raise SystemExit('Generated OpenAPI is missing GET /api/v1/workbench/modules')
        if {'hidraBearerJwt': []} not in workbench_modules.get('security', []):
            raise SystemExit('Workbench modules operation is missing hidraBearerJwt requirement')

        oidc_complete = paths.get('/api/v1/identity/authentication/oidc/complete', {}).get('post')
        if not oidc_complete:
            raise SystemExit('Generated OpenAPI is missing POST /api/v1/identity/authentication/oidc/complete')
        if {'externalOidcBearerJwt': []} not in oidc_complete.get('security', []):
            raise SystemExit('OIDC completion operation is missing externalOidcBearerJwt requirement')

        login = paths.get('/api/v1/identity/authentication/login', {}).get('post')
        if not login:
            raise SystemExit('Generated OpenAPI is missing POST /api/v1/identity/authentication/login')
        if login.get('security', None) != []:
            raise SystemExit('Public login operation must declare an empty security requirement')

        payload['x-hidra-ci-source-sha'] = '${{ github.sha }}'
        path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
        PY
    - name: Enforce canonical OpenAPI snapshot equality
      run: python3 .github/scripts/validate_openapi_snapshot.py --generated target/openapi/hidra-api.json --generated-source-sha "${{ github.sha }}"
    - name: Capture current migrated database dictionary evidence
      shell: bash
      env:
        PGHOST: 127.0.0.1
        PGPORT: '5432'
        PGDATABASE: hidra_test
        PGUSER: hidra
        PGPASSWORD: hidra
      run: |
        set -euo pipefail
        if ! command -v psql >/dev/null; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
        fi
        psql --version
        mkdir -p target/database
        DICTIONARY_ARGS=()
        if [ -f .github/database-dictionary-ownership.json ]; then
          DICTIONARY_ARGS+=(--ownership .github/database-dictionary-ownership.json --check doc/database/DATA_DICTIONARY.md)
        fi
        python3 .github/scripts/generate_data_dictionary.py \
          --collect target/database/schema.json \
          --source-sha "${{ github.sha }}" \
          --render target/database/DATA_DICTIONARY.md \
          "${DICTIONARY_ARGS[@]}" > target/database/verification.json
        cat target/database/verification.json
    - name: Retain current database dictionary evidence
      uses: actions/upload-artifact@v4
      with:
        name: hidra-database-schema-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-api-contract
        path: |
          target/database/schema.json
          target/database/DATA_DICTIONARY.md
          target/database/verification.json
        if-no-files-found: error
    - name: Resolve OpenAPI compatibility base
      id: openapi-base
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 .github/scripts/test_resolve_openapi_base.py
        python3 .github/scripts/resolve_openapi_base.py | tee target/openapi/base-provenance.txt
    - name: Generate base-revision OpenAPI contract
      shell: bash
      env:
        BASE_SHA: ${{ steps.openapi-base.outputs.sha }}
      run: |
        set -euo pipefail
        PGPASSWORD=hidra psql -h 127.0.0.1 -U hidra -d hidra_test -v ON_ERROR_STOP=1 -c "CREATE DATABASE hidra_base OWNER hidra"
        BASE_WORKTREE="${RUNNER_TEMP}/hidraapi-openapi-base"
        rm -rf "${BASE_WORKTREE}"
        git worktree add --detach "${BASE_WORKTREE}" "${BASE_SHA}"
        cleanup() {
          if [ -n "${BASE_APP_PID:-}" ]; then
            kill "${BASE_APP_PID}" 2>/dev/null || true
          fi
          git worktree remove --force "${BASE_WORKTREE}" 2>/dev/null || true
        }
        trap cleanup EXIT

        cd "${BASE_WORKTREE}"
        chmod +x mvnw
        # Build the historical application contract independently of its test sources.
        # Current-head tests are enforced by Repository verification above.
        ./mvnw -B -q -Dmaven.test.skip=true package
        BASE_APP_JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
        if [ -z "${BASE_APP_JAR}" ]; then
          echo "No executable application jar found for compatibility base ${BASE_SHA}." >&2
          exit 1
        fi

        HIDRA_TEST_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/hidra_base \
        SPRING_PROFILES_ACTIVE=test \
        SPRINGDOC_API_DOCS_ENABLED=true \
        SPRINGDOC_SWAGGER_UI_ENABLED=false \
        SERVER_PORT=8081 \
        MANAGEMENT_SERVER_PORT=8081 \
        java -jar "${BASE_APP_JAR}" > "${GITHUB_WORKSPACE}/target/openapi/base-application.log" 2>&1 &
        BASE_APP_PID=$!

        for attempt in $(seq 1 60); do
          if curl --fail --silent http://127.0.0.1:8081/actuator/health >/dev/null; then
            break
          fi
          if ! kill -0 "${BASE_APP_PID}" 2>/dev/null; then
            cat "${GITHUB_WORKSPACE}/target/openapi/base-application.log" >&2
            exit 1
          fi
          if [ "${attempt}" -eq 60 ]; then
            cat "${GITHUB_WORKSPACE}/target/openapi/base-application.log" >&2
            exit 1
          fi
          sleep 2
        done

        curl --fail --silent http://127.0.0.1:8081/v3/api-docs > "${GITHUB_WORKSPACE}/target/openapi/hidra-api-base.json"
    - name: Enforce OpenAPI backward compatibility
      run: python3 .github/scripts/openapi_compatibility.py target/openapi/hidra-api-base.json target/openapi/hidra-api.json
    - name: Upload OpenAPI compatibility artifact
      uses: actions/upload-artifact@v4
      with:
        name: hidra-api-openapi-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-api-contract
        path: target/openapi/hidra-api.json
        if-no-files-found: error
        retention-days: 30
    - name: Seal source and runtime evidence
      run: python3 .github/scripts/verify_full_ci_evidence.py stamp --kind api-contract --output target/ci/api-contract/evidence.json
      env:
        HIDRA_BASE_SHA: ${{ steps.openapi-base.outputs.sha }}
    - name: Retain lane evidence and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hidra-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-api-contract
        path: target/ci/api-contract/
        if-no-files-found: error
        retention-days: 14
    - name: Retain raw failure logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hidra-ci-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-api-contract
        path: |-
          target/surefire-reports/
          target/openapi/
          target/database/
        if-no-files-found: warn
        retention-days: 14
  verify:
    name: Java 21 Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hidra_test
          POSTGRES_USER: hidra
          POSTGRES_PASSWORD: hidra
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U hidra -d hidra_test" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Test canonical documentation validators
      run: |

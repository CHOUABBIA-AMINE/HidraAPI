name: AUTH-022 roadmap finalizer

on:
  push:
    branches:
      - auth-022-dynamic-provider-routing-tests
    paths:
      - .github/auth022_finalize.py
      - .github/workflows/auth022-roadmap-finalizer.yml

permissions:
  contents: write

jobs:
  finalize-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-022-dynamic-provider-routing-tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update authentication roadmap
        run: python .github/auth022_finalize.py
      - name: Commit roadmap update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/authentication.md
          git commit -m "test(authentication): cover dynamic provider routing"
          git push origin HEAD:auth-022-dynamic-provider-routing-tests

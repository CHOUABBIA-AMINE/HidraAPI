name: AUTH-030 initial closure evidence
on:
  push:
    branches:
      - auth-030-finalize-authentication-gap-closure
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-030-finalize-authentication-gap-closure
          fetch-depth: 0
      - name: Record AUTH-030 closure evidence
        run: bash .github/auth-030-initial.sh

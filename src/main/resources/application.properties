# =====================================================================
# HidraAPI - Common application configuration
# Hydrocarbon Intelligence for Data, Risk, and Analytics
#
# This file contains profile-independent defaults only.
# Select an environment with:
#   SPRING_PROFILES_ACTIVE=dev|test|staging|production
# =====================================================================

# ---------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------
# Default local profile.
# When no explicit SPRING_PROFILES_ACTIVE is provided, HidraAPI starts with the dev profile.
# Staging and production deployments must set SPRING_PROFILES_ACTIVE explicitly.
spring.profiles.default=${SPRING_PROFILES_DEFAULT:dev}

spring.application.name=hidra-api
spring.main.banner-mode=console

# ---------------------------------------------------------------------
# JSON / Jackson
# ---------------------------------------------------------------------
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------------------------------------------------------------------
# Web / MVC
# ---------------------------------------------------------------------
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------------
# Datasource / JPA
# ---------------------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------
spring.cache.type=simple

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# ---------------------------------------------------------------------
# Actuator / Observability
# ---------------------------------------------------------------------
management.server.port=${MANAGEMENT_SERVER_PORT:${SERVER_PORT:8080}}
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${HIDRA_ENVIRONMENT:unknown}
management.prometheus.metrics.export.enabled=true

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.dz.sh.hidra=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-no-correlation}] [%X{requestId:-no-request}] [%X{actorId:-anonymous}] %logger{36} - %msg%n

# ---------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------------
# Hidra custom platform properties
# These are placeholders for future @ConfigurationProperties classes.
# ---------------------------------------------------------------------
hidra.application.name=HidraAPI
hidra.application.description=Hydrocarbon Intelligence for Data, Risk, and Analytics
hidra.application.base-package=dz.sh.hidra

hidra.platform.observability.correlation.header-name=X-Correlation-Id
hidra.platform.observability.correlation.response-header-enabled=true
hidra.platform.observability.request.header-name=X-Request-Id
hidra.platform.observability.request.response-header-enabled=true
hidra.platform.observability.logging.structured=true
hidra.platform.observability.logging.mask-sensitive-values=true

hidra.platform.security.enabled=true
hidra.platform.security.cors.enabled=true
hidra.platform.security.cors.allowed-origins=
hidra.platform.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
hidra.platform.security.cors.allowed-headers=Authorization,Content-Type,X-Correlation-Id,X-Request-Id
hidra.platform.security.cors.exposed-headers=X-Correlation-Id,X-Request-Id
hidra.platform.security.csrf.enabled=false

# Explicit bootstrap user prevents Spring Boot from generating a random development password.
# Override HIDRA_SECURITY_BOOTSTRAP_PASSWORD outside local development.
hidra.security.bootstrap.username=${HIDRA_SECURITY_BOOTSTRAP_USERNAME:hidra-admin}
hidra.security.bootstrap.password=${HIDRA_SECURITY_BOOTSTRAP_PASSWORD:hidra-dev-change-me}
hidra.security.bootstrap.roles=${HIDRA_SECURITY_BOOTSTRAP_ROLES:HIDRA_ADMIN}

hidra.platform.persistence.auditing.enabled=true
hidra.platform.persistence.optimistic-locking.enabled=true

hidra.platform.events.outbox.enabled=false
hidra.platform.events.outbox.table-name=hidra_platform_outbox_event
hidra.platform.events.outbox.batch-size=50
hidra.platform.events.outbox.max-retry-count=5
hidra.platform.events.outbox.cleanup-enabled=false

hidra.platform.tenancy.enabled=false
hidra.platform.tenancy.default-scope=SH

hidra.api.version=v1
hidra.api.base-path=/api/v1
hidra.api.errors.include-debug-details=false
hidra.api.errors.include-correlation-id=true
hidra.platform.security.authentication-mode=${HIDRA_SECURITY_AUTHENTICATION_MODE:jwt}
hidra.platform.security.jwt.issuer-uri=${HIDRA_JWT_ISSUER_URI:}
hidra.platform.security.jwt.jwk-set-uri=${HIDRA_JWT_JWK_SET_URI:}
hidra.platform.security.jwt.hmac-secret=${HIDRA_JWT_HMAC_SECRET:}
hidra.platform.security.jwt.audience=${HIDRA_JWT_AUDIENCE:hidra-api}
hidra.platform.security.jwt.principal-claim=${HIDRA_JWT_PRINCIPAL_CLAIM:sub}
hidra.platform.security.jwt.roles-claim=${HIDRA_JWT_ROLES_CLAIM:roles}
hidra.platform.security.jwt.scope-claim=${HIDRA_JWT_SCOPE_CLAIM:scope}
hidra.platform.security.jwt.authority-prefix=${HIDRA_JWT_AUTHORITY_PREFIX:ROLE_}

# ---------------------------------------------------------------------
# Notification asynchronous push
# ---------------------------------------------------------------------
hidra.notification.async-push.enabled=${HIDRA_NOTIFICATION_ASYNC_PUSH_ENABLED:true}
hidra.notification.async-push.core-pool-size=${HIDRA_NOTIFICATION_ASYNC_PUSH_CORE_POOL_SIZE:4}
hidra.notification.async-push.max-pool-size=${HIDRA_NOTIFICATION_ASYNC_PUSH_MAX_POOL_SIZE:12}
hidra.notification.async-push.queue-capacity=${HIDRA_NOTIFICATION_ASYNC_PUSH_QUEUE_CAPACITY:500}
hidra.notification.async-push.thread-name-prefix=${HIDRA_NOTIFICATION_ASYNC_PUSH_THREAD_PREFIX:HidraNotificationPush-}
hidra.notification.push.provider-reference=${HIDRA_NOTIFICATION_PUSH_PROVIDER_REFERENCE:hidra-local-async-push}

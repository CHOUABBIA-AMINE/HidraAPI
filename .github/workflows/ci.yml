name: HidraAPI CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "doc/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "doc/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hidraapi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 21 Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hidra_test
          POSTGRES_USER: hidra
          POSTGRES_PASSWORD: hidra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hidra -d hidra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: One-shot roadmap reconciliation
        if: github.event_name == 'push' && github.event.head_commit.message == 'chore(roadmap): execute P1 status reconciliation'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('doc/roadmap/ULTIMATE_ROADMAP.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "| HPR-P1-027 | PENDING — re-audit Check 11 remediation | Database Operations | Infra/Test/Doc | Complete database health inspection coverage with PostgreSQL index validity/readiness and a reviewed bloat/space-risk method that does not assume unapproved extensions; add host/filesystem capacity evidence outside SQL; retain guarded maintenance semantics and validate diagnostic/maintenance procedures with post-maintenance acceptance in production-equivalent infrastructure. | `fix(database): complete operational health inspections` | HPR-P1-020 |":
              "| HPR-P1-027 | COMPLETED — implementation SHA `cafdc42270085ddf513a23a514f437ef39f7b842` passed exact-head full CI #555 / run id `37433450282`. Database operations now include PostgreSQL index validity/readiness/liveness inspection, extension-free dead-tuple/object-size/index-ratio space-risk triage without assuming unapproved extensions, host/filesystem byte+inode capacity capture outside SQL, and a guarded maintenance-validation harness requiring authenticated database-backed HidraAPI acceptance before and after the selected action. Actual production-equivalent diagnostic/maintenance execution remains HPR-P1-029 evidence scope. | Database Operations | Infra/Test/Doc | Complete database health inspection coverage with PostgreSQL index validity/readiness and a reviewed bloat/space-risk method that does not assume unapproved extensions; add host/filesystem capacity evidence outside SQL; retain guarded maintenance semantics and validate diagnostic/maintenance procedures with post-maintenance acceptance in production-equivalent infrastructure. | `fix(database): complete operational health inspections` | HPR-P1-020 |",
              "| HPR-P1-028 | PENDING — re-audit Check 12 remediation | Retention / Archival | Infra/Test/Doc | Enforce the approved P1 retention controls in executable configuration: distinguish bootstrap from mature monthly coverage and verify distinct monthly repo2 recovery points up to the required 12-month horizon; bind Prometheus 30-day and Loki 90-day retention/deletion settings; verify repo2 protected-copy independence and retained recovery-point restorability in the later production-equivalent exercise. | `fix(operations): enforce p1 retention controls` | HPR-P1-021 + HPR-P1-026 |":
              "| HPR-P1-028 | COMPLETED — implementation SHA `e12a2205f397e68edf1bda96211a99966577d501` passed exact-head full CI #559 / run id `37435329469`. Repo2 validation now distinguishes bootstrap from mature policy coverage, requires one distinct completed full recovery point for each required UTC calendar month from the approved 2026-10 policy start, rejects duplicate/missing required months, and retains the 12-point mature horizon; Prometheus now runs with executable `30d` TSDB retention and Loki with `90d` retention plus compactor deletion. Protected-copy independence and retained repo2 restorability remain HPR-P1-029 measured evidence scope. | Retention / Archival | Infra/Test/Doc | Enforce the approved P1 retention controls in executable configuration: distinguish bootstrap from mature monthly coverage and verify distinct monthly repo2 recovery points up to the required 12-month horizon; bind Prometheus 30-day and Loki 90-day retention/deletion settings; verify repo2 protected-copy independence and retained recovery-point restorability in the later production-equivalent exercise. | `fix(operations): enforce p1 retention controls` | HPR-P1-021 + HPR-P1-026 |",
              "`HPR-P1-027 — fix(database): complete operational health inspections`\n\nHPR-P1-021..026 repository remediation is complete and exact-head verified. Execution proceeds with HPR-P1-027, then HPR-P1-028, followed by the integrated production-equivalent evidence gate HPR-P1-029.":
              "`HPR-P1-029 — test(operations): execute p1 survivability exercises`\n\nHPR-P1-021..028 repository remediation is complete and exact-head verified. The remaining P1 remediation step is the integrated production-equivalent evidence campaign HPR-P1-029; HPR-P1-012 remains blocked until that campaign is completed and accepted."
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one roadmap occurrence, found {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          marker = "### HPR-P1-026 observability wiring evidence\n"
          if text.count(marker) != 1:
              raise SystemExit('Expected one HPR-P1-026 evidence marker')

          evidence = """### HPR-P1-028 retention enforcement evidence

- implementation SHA: `e12a2205f397e68edf1bda96211a99966577d501`;
- exact-head full CI #559 / run id `37435329469`: **SUCCESS**;
- repo2 validation distinguishes bootstrap from mature monthly coverage and requires distinct required UTC calendar months under `HIDRA-P1-BACKUP-RETENTION-001`;
- mature coverage is bounded to the latest 12 required monthly recovery points; missing or duplicate required months fail validation;
- Prometheus executable service configuration enforces `--storage.tsdb.retention.time=30d`;
- Loki enforces `retention_period: 2160h` with compactor retention/deletion and a filesystem delete-request store;
- physical independence of repo2 and successful restore from a retained repo2 point remain measured HPR-P1-029 evidence requirements.

### HPR-P1-027 database operations completion evidence

- implementation SHA: `cafdc42270085ddf513a23a514f437ef39f7b842`;
- exact-head full CI #555 / run id `37433450282`: **SUCCESS**;
- index inspection now records `indisvalid`, `indisready` and `indislive` from PostgreSQL catalogs;
- bloat/space-risk triage remains extension-free and is explicitly not misrepresented as an exact physical-bloat percentage;
- host/filesystem bytes and inode capacity are captured separately from PostgreSQL object-size SQL;
- guarded maintenance validation requires a selected approved action plus authenticated database-backed HidraAPI acceptance before and after maintenance;
- actual production-equivalent diagnostic/maintenance execution remains HPR-P1-029 evidence scope.

"""
          text = text.replace(marker, evidence + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/ci.yml
          git rm .github/workflows/reconcile-p1-roadmap.yml
          git add doc/roadmap/ULTIMATE_ROADMAP.md .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "docs(roadmap): reconcile P1 verification status"
          git push origin HEAD:main

      - name: Validate production application HA runtime artifacts
        run: bash ops/production/scripts/validate-runtime-artifacts.sh

      - name: Validate production PostgreSQL HA artifacts
        run: bash ops/production/postgres/scripts/validate-postgres-ha-artifacts.sh

      - name: Validate production pgBackRest backup/PITR artifacts
        run: bash ops/production/postgres/scripts/validate-backup-pitr-artifacts.sh

      - name: Validate controlled release artifacts
        run: bash ops/production/release/validate-release-artifacts.sh

      - name: Validate production observability artifacts
        run: bash ops/production/observability/validate-observability-artifacts.sh

      - name: Validate database operations procedures
        run: bash ops/production/postgres/scripts/validate-database-operations.sh

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Repository verification
        run: ./mvnw -B -q clean verify

      - name: Publish deterministic OpenAPI contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/openapi
          APP_JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          if [ -z "${APP_JAR}" ]; then
            echo "No executable application jar found after verify." >&2
            exit 1
          fi
          SPRING_PROFILES_ACTIVE=test \
          SPRINGDOC_API_DOCS_ENABLED=true \
          SPRINGDOC_SWAGGER_UI_ENABLED=false \
          SERVER_PORT=8080 \
          MANAGEMENT_SERVER_PORT=8080 \
          java -jar "${APP_JAR}" > target/openapi/application.log 2>&1 &
          APP_PID=$!
          trap 'kill ${APP_PID} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              break
            fi
            if ! kill -0 "${APP_PID}" 2>/dev/null; then
              cat target/openapi/application.log >&2
              exit 1
            fi
            if [ "${attempt}" -eq 60 ]; then
              cat target/openapi/application.log >&2
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/v3/api-docs > target/openapi/hidra-api.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('target/openapi/hidra-api.json')
          payload = json.loads(path.read_text(encoding='utf-8'))

          schemes = payload.get('components', {}).get('securitySchemes', {})
          required_schemes = {'hidraBearerJwt', 'externalOidcBearerJwt'}
          missing_schemes = sorted(required_schemes - set(schemes))
          if missing_schemes:
              raise SystemExit(f"Missing OpenAPI security schemes: {missing_schemes}")

          for name in ('hidraBearerJwt', 'externalOidcBearerJwt'):
              scheme = schemes[name]
              if scheme.get('type') != 'http' or scheme.get('scheme') != 'bearer' or scheme.get('bearerFormat') != 'JWT':
                  raise SystemExit(f"Invalid bearer security scheme {name}: {scheme}")

          paths = payload.get('paths', {})

          workbench_modules = paths.get('/api/v1/workbench/modules', {}).get('get')
          if not workbench_modules:
              raise SystemExit('Generated OpenAPI is missing GET /api/v1/workbench/modules')
          if {'hidraBearerJwt': []} not in workbench_modules.get('security', []):
              raise SystemExit('Workbench modules operation is missing hidraBearerJwt requirement')

          oidc_complete = paths.get('/api/v1/identity/authentication/oidc/complete', {}).get('post')
          if not oidc_complete:
              raise SystemExit('Generated OpenAPI is missing POST /api/v1/identity/authentication/oidc/complete')
          if {'externalOidcBearerJwt': []} not in oidc_complete.get('security', []):
              raise SystemExit('OIDC completion operation is missing externalOidcBearerJwt requirement')

          login = paths.get('/api/v1/identity/authentication/login', {}).get('post')
          if not login:
              raise SystemExit('Generated OpenAPI is missing POST /api/v1/identity/authentication/login')
          if login.get('security', None) != []:
              raise SystemExit('Public login operation must declare an empty security requirement')

          payload['x-hidra-ci-source-sha'] = '${{ github.sha }}'
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Resolve OpenAPI compatibility base
        id: openapi-base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "No compatibility base revision is available for this run." >&2
            exit 1
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          echo "sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Generate base-revision OpenAPI contract
        shell: bash
        env:
          BASE_SHA: "${{ steps.openapi-base.outputs.sha }}"
        run: |
          set -euo pipefail
          BASE_WORKTREE="${RUNNER_TEMP}/hidraapi-openapi-base"
          rm -rf "${BASE_WORKTREE}"
          git worktree add --detach "${BASE_WORKTREE}" "${BASE_SHA}"
          cleanup() {
            if [ -n "${BASE_APP_PID:-}" ]; then
              kill "${BASE_APP_PID}" 2>/dev/null || true
            fi
            git worktree remove --force "${BASE_WORKTREE}" 2>/dev/null || true
          }
          trap cleanup EXIT

          cd "${BASE_WORKTREE}"
          chmod +x mvnw
          ./mvnw -B -q -DskipTests package
          BASE_APP_JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          if [ -z "${BASE_APP_JAR}" ]; then
            echo "No executable application jar found for compatibility base ${BASE_SHA}." >&2
            exit 1
          fi

          SPRING_PROFILES_ACTIVE=test \
          SPRINGDOC_API_DOCS_ENABLED=true \
          SPRINGDOC_SWAGGER_UI_ENABLED=false \
          SERVER_PORT=8081 \
          MANAGEMENT_SERVER_PORT=8081 \
          java -jar "${BASE_APP_JAR}" > "${GITHUB_WORKSPACE}/target/openapi/base-application.log" 2>&1 &
          BASE_APP_PID=$!

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/actuator/health >/dev/null; then
              break
            fi
            if ! kill -0 "${BASE_APP_PID}" 2>/dev/null; then
              cat "${GITHUB_WORKSPACE}/target/openapi/base-application.log" >&2
              exit 1
            fi
            if [ "${attempt}" -eq 60 ]; then
              cat "${GITHUB_WORKSPACE}/target/openapi/base-application.log" >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8081/v3/api-docs > "${GITHUB_WORKSPACE}/target/openapi/hidra-api-base.json"

      - name: Enforce OpenAPI backward compatibility
        run: >-
          python3 .github/scripts/openapi_compatibility.py
          target/openapi/hidra-api-base.json
          target/openapi/hidra-api.json

      - name: Upload OpenAPI compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidra-api-openapi-${{ github.sha }}
          path: target/openapi/hidra-api.json
          if-no-files-found: error
          retention-days: 30

name: Reconcile P1 Roadmap Status

on:
  push:
    paths:
      - ".github/workflows/reconcile-p1-roadmap.yml"
      - ".github/scripts/reconcile_p1_roadmap.py"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified roadmap reconciliation
        run: python3 .github/scripts/reconcile_p1_roadmap.py

      - name: Commit roadmap reconciliation and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconcile-p1-roadmap.yml .github/scripts/reconcile_p1_roadmap.py
          git add doc/roadmap/ULTIMATE_ROADMAP.md
          git diff --cached --check
          git commit -m "docs(roadmap): reconcile P1 verification status"
          git push origin HEAD:main

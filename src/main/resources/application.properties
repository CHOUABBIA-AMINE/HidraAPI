spring.application.name=HidraAPI

spring.datasource.url=${HIDRA_DB_URL:jdbc:postgresql://localhost:5432/hidra}
spring.datasource.username=${HIDRA_DB_USERNAME:hidra}
spring.datasource.password=${HIDRA_DB_PASSWORD:hidra}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Hidra platform
hidra.application.name=HidraAPI
hidra.application.description=Hydrocarbon Intelligence for Data, Risk, and Analytics
hidra.application.base-package=dz.sh.hidra

hidra.platform.observability.correlation.header-name=X-Correlation-Id
hidra.platform.observability.correlation.response-header-enabled=true
hidra.platform.observability.request.header-name=X-Request-Id
hidra.platform.observability.request.response-header-enabled=true
hidra.platform.observability.logging.structured=true
hidra.platform.observability.logging.mask-sensitive-values=true

hidra.platform.security.enabled=true
hidra.platform.security.cors.enabled=true
hidra.platform.security.cors.allowed-origins=
hidra.platform.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
hidra.platform.security.cors.allowed-headers=Authorization,Content-Type,X-Correlation-Id,X-Request-Id
hidra.platform.security.cors.exposed-headers=X-Correlation-Id,X-Request-Id
hidra.platform.security.csrf.enabled=false
hidra.platform.security.authentication-mode=${HIDRA_SECURITY_AUTHENTICATION_MODE:jwt}

# Explicit bootstrap user prevents Spring Boot from generating a random development password.
hidra.security.bootstrap.username=${HIDRA_SECURITY_BOOTSTRAP_USERNAME:hidra-admin}
hidra.security.bootstrap.password=${HIDRA_SECURITY_BOOTSTRAP_PASSWORD:hidra-dev-change-me}
hidra.security.bootstrap.roles=${HIDRA_SECURITY_BOOTSTRAP_ROLES:HIDRA_ADMIN}

# JWT resource-server validation and Hidra access-token issuance contract.
hidra.platform.security.jwt.issuer-uri=${HIDRA_JWT_ISSUER_URI:}
hidra.platform.security.jwt.jwk-set-uri=${HIDRA_JWT_JWK_SET_URI:}
hidra.platform.security.jwt.hmac-secret=${HIDRA_JWT_HMAC_SECRET:}
hidra.platform.security.jwt.token-issuer=${HIDRA_JWT_TOKEN_ISSUER:hidra-api}
hidra.platform.security.jwt.audience=${HIDRA_JWT_AUDIENCE:hidra-api}
hidra.platform.security.jwt.access-token-ttl-seconds=${HIDRA_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
hidra.platform.security.jwt.principal-claim=${HIDRA_JWT_PRINCIPAL_CLAIM:sub}
hidra.platform.security.jwt.roles-claim=${HIDRA_JWT_ROLES_CLAIM:roles}
hidra.platform.security.jwt.scope-claim=${HIDRA_JWT_SCOPE_CLAIM:scope}
hidra.platform.security.jwt.authority-prefix=${HIDRA_JWT_AUTHORITY_PREFIX:ROLE_}

# Browser OIDC authorization-code + PKCE contract. No client secret belongs in this repository.
hidra.platform.security.oidc.client-id=${HIDRA_OIDC_CLIENT_ID:}
hidra.platform.security.oidc.scopes=${HIDRA_OIDC_SCOPES:openid,profile}
hidra.platform.security.oidc.logout-uri=${HIDRA_OIDC_LOGOUT_URI:}

# LDAP / Active Directory connection infrastructure. Secrets remain externalized.
hidra.platform.security.ldap.enabled=${HIDRA_LDAP_ENABLED:false}
hidra.platform.security.ldap.url=${HIDRA_LDAP_URL:}
hidra.platform.security.ldap.base-dn=${HIDRA_LDAP_BASE_DN:}
hidra.platform.security.ldap.user-search-base=${HIDRA_LDAP_USER_SEARCH_BASE:}
hidra.platform.security.ldap.user-search-filter=${HIDRA_LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}
hidra.platform.security.ldap.bind-dn=${HIDRA_LDAP_BIND_DN:}
hidra.platform.security.ldap.bind-password=${HIDRA_LDAP_BIND_PASSWORD:}
hidra.platform.security.ldap.connect-timeout=${HIDRA_LDAP_CONNECT_TIMEOUT:5s}
hidra.platform.security.ldap.read-timeout=${HIDRA_LDAP_READ_TIMEOUT:5s}

hidra.platform.persistence.auditing.enabled=true
hidra.platform.persistence.optimistic-locking.enabled=true

hidra.notification.push.provider-reference=${HIDRA_NOTIFICATION_PUSH_PROVIDER_REFERENCE:}
hidra.platform.realtime.enabled=${HIDRA_REALTIME_ENABLED:true}
hidra.platform.realtime.stomp-endpoint=${HIDRA_REALTIME_STOMP_ENDPOINT:/api/v1/realtime/ws}
hidra.platform.realtime.sse-endpoint=${HIDRA_REALTIME_SSE_ENDPOINT:/api/v1/realtime/sse}
hidra.platform.realtime.heartbeat-ms=${HIDRA_REALTIME_HEARTBEAT_MS:30000}
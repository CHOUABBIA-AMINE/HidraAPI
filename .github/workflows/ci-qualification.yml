name: HidraAPI CI Qualification (isolated)
'on':
  push:
    branches: [main]
    paths:
      - 'scripts/qualification/**'
      - 'doc/operations/FD02_ONE_NODE_API_QUALIFICATION.md'
      - 'doc/roadmap/TASKS_HPS-025.md'
      - '.github/workflows/ci-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hidra-ci-qualification-${{ github.sha }}
  cancel-in-progress: false
jobs:
  synthetic-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Synthetic fail-closed evidence checks
      run: python3 scripts/ci/qualification/verify.py
  cache-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Controlled isolated Maven cache miss
      id: cold
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/hidra-hq1-m2
        key: hidra-hq1-cold-${{ github.run_id }}-${{ github.run_attempt }}
        lookup-only: true
    - name: Assert isolated cache miss
      env:
        HIT: ${{ steps.cold.outputs.cache-hit }}
      run: test "${HIT}" != true
    - name: Prepare dependency repository (cold)
      run: |
        set -euo pipefail
        chmod +x mvnw
        bash ./mvnw -B -ntp -Dmaven.repo.local="${{ runner.temp }}/hidra-hq1-m2" dependency:go-offline
    - name: Save isolated cache
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/hidra-hq1-m2
        key: hidra-hq1-warm-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Restore controlled warm cache
      id: warm
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/hidra-hq1-m2
        key: hidra-hq1-warm-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Assert warm cache hit
      env:
        HIT: ${{ steps.warm.outputs.cache-hit }}
      run: test "${HIT}" = true
    - name: Prepare dependency repository (warm)
      run: bash ./mvnw -B -ntp -Dmaven.repo.local="${{ runner.temp }}/hidra-hq1-m2" dependency:go-offline
    - name: Evidence scope
      run: echo 'Controlled actions/cache identity only; not Full oracle test timing or production setup-java cache proof.'

  hosted-negative-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Deliberately fail isolated required-step probe
      id: failed
      continue-on-error: true
      run: exit 17
    - name: Deliberately fail missing artifact upload
      id: missing
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: hidra-hq1-intentionally-missing-${{ github.run_id }}
        path: ${{ runner.temp }}/hidra-hq1-no-such-artifact-expected
        if-no-files-found: error
    - name: Assert both hosted probes really failed
      env:
        FAILED_OUTCOME: ${{ steps.failed.outcome }}
        MISSING_OUTCOME: ${{ steps.missing.outcome }}
      run: |
        set -euo pipefail
        test "${FAILED_OUTCOME}" = failure
        test "${MISSING_OUTCOME}" = failure
        echo 'Isolated hosted negative step and missing upload rejected as expected; no production gate exercised.'

  aggregate-policy-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Execute actual production aggregate verifier negative fixtures (isolated)
      env:
        PYTHONPATH: .github/scripts
      run: |
        set -euo pipefail
        python3 .github/scripts/test_verify_full_ci_evidence.py -v
    - name: Qualification boundary
      run: echo 'Real aggregate-verifier unit fixtures executed on hosted runner; no injected failure in production Full workflow.'

  fd02-runtime:
    name: FD02 real JAR / PostgreSQL 16 / native HTTP / restart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fd02-ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Bounded Python HTTP/evidence unit fixtures
        run: python3 -m unittest discover -s scripts/qualification -p 'test_fd02_native_http_checks.py' -v
      - name: Runtime script syntax and actual one-node qualification
        env:
          FD02_PG_ADMIN_PASSWORD: fd02-ci-${{ github.run_id }}-${{ github.run_attempt }}
          FD02_EVIDENCE_DIR: ${{ runner.temp }}/fd02-evidence
        run: |
          set -euo pipefail
          bash -n scripts/qualification/fd02_one_node_runtime.sh
          bash scripts/qualification/fd02_one_node_runtime.sh
      - name: Preserve redacted FD02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidra-fd02-${{ github.sha }}
          path: ${{ runner.temp }}/fd02-evidence/
          if-no-files-found: warn

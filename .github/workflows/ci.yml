name: HidraAPI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidraapi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 21 Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Compile production code
        run: ./mvnw -B -q -DskipTests compile

      - name: Run tests
        run: ./mvnw -B -q test

      - name: Run full verification
        run: ./mvnw -B -q clean verify

name: HidraAPI Fast Feedback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-domain-tests:
    name: Java 21 focused station graph tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Execute explicitly selected domain tests
        run: ./mvnw -B -q -Dtest=StationInternalGraphTest,StationInternalGraphValidatorTest test

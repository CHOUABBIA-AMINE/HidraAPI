# =====================================================================
# HidraAPI - Production profile
# Activate with:
#   SPRING_PROFILES_ACTIVE=production
#
# Production must be configured only through environment variables,
# externalized configuration, or a secrets manager.
# =====================================================================

spring.config.activate.on-profile=production

# ---------------------------------------------------------------------
# Datasource / JPA
# ---------------------------------------------------------------------
spring.datasource.url=${HIDRA_DATASOURCE_URL}
spring.datasource.username=${HIDRA_DATASOURCE_USERNAME}
spring.datasource.password=${HIDRA_DATASOURCE_PASSWORD}
spring.datasource.hikari.pool-name=HidraProductionHikariPool
spring.datasource.hikari.maximum-pool-size=${HIDRA_DATASOURCE_MAX_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${HIDRA_DATASOURCE_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=0

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.dz.sh.hidra=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ---------------------------------------------------------------------
# OpenAPI
# ---------------------------------------------------------------------
springdoc.api-docs.enabled=${HIDRA_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${HIDRA_SWAGGER_UI_ENABLED:false}

# ---------------------------------------------------------------------
# Hidra custom properties
# ---------------------------------------------------------------------
hidra.environment=production
hidra.platform.security.cors.allowed-origins=${HIDRA_CORS_ALLOWED_ORIGINS:}
hidra.platform.events.outbox.cleanup-enabled=${HIDRA_OUTBOX_CLEANUP_ENABLED:false}
hidra.platform.events.outbox.batch-size=${HIDRA_OUTBOX_BATCH_SIZE:100}
hidra.platform.events.outbox.max-retry-count=${HIDRA_OUTBOX_MAX_RETRY_COUNT:5}
hidra.api.errors.include-debug-details=false

# ---------------------------------------------------------------------
# Security bootstrap credentials
# ---------------------------------------------------------------------
hidra.security.bootstrap.username=${HIDRA_SECURITY_BOOTSTRAP_USERNAME:hidra-admin}
hidra.security.bootstrap.password=${HIDRA_SECURITY_BOOTSTRAP_PASSWORD:hidra-dev-change-me}
hidra.security.bootstrap.roles=${HIDRA_SECURITY_BOOTSTRAP_ROLES:HIDRA_ADMIN}
hidra.platform.security.authentication-mode=${HIDRA_SECURITY_AUTHENTICATION_MODE:jwt}
hidra.platform.security.jwt.issuer-uri=${HIDRA_JWT_ISSUER_URI:}
hidra.platform.security.jwt.jwk-set-uri=${HIDRA_JWT_JWK_SET_URI:}
hidra.platform.security.jwt.hmac-secret=${HIDRA_JWT_HMAC_SECRET:}
hidra.platform.security.jwt.audience=${HIDRA_JWT_AUDIENCE:hidra-api}

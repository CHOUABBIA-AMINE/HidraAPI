# =====================================================================
# HidraAPI - Test profile
# Activate with:
#   SPRING_PROFILES_ACTIVE=test
#
# This profile assumes tests may override datasource properties through
# Testcontainers DynamicPropertySource.
# =====================================================================

spring.config.activate.on-profile=test

# ---------------------------------------------------------------------
# Datasource / JPA
# ---------------------------------------------------------------------
spring.datasource.url=${HIDRA_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hidra_test}
spring.datasource.username=${HIDRA_TEST_DATASOURCE_USERNAME:hidra}
spring.datasource.password=${HIDRA_TEST_DATASOURCE_PASSWORD:hidra}
spring.datasource.hikari.pool-name=HidraTestHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.clean-disabled=false
spring.flyway.validate-on-migrate=true

spring.cache.type=simple

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=0

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=WARN
logging.level.dz.sh.hidra=INFO
logging.level.org.springframework.test=INFO
logging.level.org.testcontainers=INFO
logging.level.org.hibernate.SQL=WARN

# ---------------------------------------------------------------------
# OpenAPI
# ---------------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------------------------------------------------------------------
# Hidra custom properties
# ---------------------------------------------------------------------
hidra.environment=test
hidra.platform.security.cors.allowed-origins=
hidra.platform.events.outbox.enabled=true
hidra.platform.events.outbox.cleanup-enabled=true
hidra.platform.events.outbox.batch-size=10
hidra.platform.events.outbox.max-retry-count=2
hidra.api.errors.include-debug-details=true

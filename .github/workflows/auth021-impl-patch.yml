name: AUTH-021 Implementation Patch

on:
  push:
    branches:
      - auth-021-safe-local-admin-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auth021-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AUTH-021 configuration cutover
        run: python3 .github/auth021_impl_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Aminosoft'
          git config user.email '147345045+CHOUABBIA-AMINE@users.noreply.github.com'
          git add src/main/java/dz/sh/hidra/platform/configuration/HidraSecurityConfiguration.java src/main/resources/application*.properties
          git commit -m 'feat(authentication): add safe local administrator bootstrap [auth021-patched]'
          git push origin HEAD:auth-021-safe-local-admin-bootstrap

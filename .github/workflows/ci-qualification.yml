name: HidraAPI CI Qualification (isolated)
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hidra-ci-qualification-${{ github.sha }}
  cancel-in-progress: false
jobs:
  synthetic-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic fail-closed evidence checks
        run: python3 scripts/ci/qualification/verify.py
  maven-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Controlled cold Maven repository
        run: |
          set -euo pipefail
          chmod +x mvnw
          bash ./mvnw -B -ntp -Dmaven.repo.local="${{ runner.temp }}/hidra-qualification-cold" dependency:go-offline
      - name: Controlled warm Maven repository
        run: bash ./mvnw -B -ntp -Dmaven.repo.local="${{ runner.temp }}/hidra-qualification-cold" dependency:go-offline
      - name: Qualification scope notice
        run: echo 'Dependency-cache preparation only; no Full CI acceptance or controlled setup-java cache hit/miss claim.'

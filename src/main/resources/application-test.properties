# =====================================================================
# HidraAPI - Test profile
# Activate with:
#   SPRING_PROFILES_ACTIVE=test
#
# This profile assumes tests may override datasource properties through
# Testcontainers DynamicPropertySource.
# =====================================================================

spring.config.activate.on-profile=test

# ---------------------------------------------------------------------
# Datasource / JPA
# ---------------------------------------------------------------------
spring.datasource.url=${HIDRA_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hidra_test}
spring.datasource.username=${HIDRA_TEST_DATASOURCE_USERNAME:hidra}
spring.datasource.password=${HIDRA_TEST_DATASOURCE_PASSWORD:hidra}
spring.datasource.hikari.pool-name=HidraTestHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.clean-disabled=false
spring.flyway.validate-on-migrate=true

spring.cache.type=simple

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=0

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=WARN
logging.level.dz.sh.hidra=INFO
logging.level.org.springframework.test=INFO
logging.level.org.testcontainers=INFO
logging.level.org.hibernate.SQL=WARN

# ---------------------------------------------------------------------
# OpenAPI
# ---------------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------------------------------------------------------------------
# Hidra custom properties
# ---------------------------------------------------------------------
hidra.environment=test
hidra.platform.security.cors.allowed-origins=
hidra.platform.events.outbox.enabled=false
hidra.platform.events.outbox.cleanup-enabled=true
hidra.platform.events.outbox.batch-size=10
hidra.platform.events.outbox.max-retry-count=2
hidra.api.errors.include-debug-details=true

# ---------------------------------------------------------------------
# Security bootstrap credentials
# ---------------------------------------------------------------------
hidra.security.bootstrap.username=${HIDRA_SECURITY_BOOTSTRAP_USERNAME:hidra-admin}
hidra.security.bootstrap.password=${HIDRA_SECURITY_BOOTSTRAP_PASSWORD:hidra-test-change-me}
hidra.security.bootstrap.roles=${HIDRA_SECURITY_BOOTSTRAP_ROLES:HIDRA_ADMIN}
hidra.platform.security.authentication-mode=${HIDRA_SECURITY_AUTHENTICATION_MODE:basic}
hidra.platform.security.jwt.hmac-secret=${HIDRA_JWT_HMAC_SECRET:hidra-test-jwt-secret-change-me-please-32-bytes-minimum}
hidra.platform.security.jwt.audience=${HIDRA_JWT_AUDIENCE:hidra-api}

# ---------------------------------------------------------------------
# Notification asynchronous push
# ---------------------------------------------------------------------
hidra.notification.async-push.enabled=${HIDRA_NOTIFICATION_ASYNC_PUSH_ENABLED:true}
hidra.notification.async-push.core-pool-size=${HIDRA_NOTIFICATION_ASYNC_PUSH_CORE_POOL_SIZE:4}
hidra.notification.async-push.max-pool-size=${HIDRA_NOTIFICATION_ASYNC_PUSH_MAX_POOL_SIZE:12}
hidra.notification.async-push.queue-capacity=${HIDRA_NOTIFICATION_ASYNC_PUSH_QUEUE_CAPACITY:500}
hidra.notification.async-push.thread-name-prefix=${HIDRA_NOTIFICATION_ASYNC_PUSH_THREAD_PREFIX:HidraNotificationPush-}
hidra.notification.push.provider-reference=${HIDRA_NOTIFICATION_PUSH_PROVIDER_REFERENCE:hidra-local-async-push}

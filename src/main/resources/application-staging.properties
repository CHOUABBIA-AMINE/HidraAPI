# =====================================================================
# HidraAPI - Staging profile
# Activate with:
#   SPRING_PROFILES_ACTIVE=staging
# =====================================================================

spring.config.activate.on-profile=staging

# ---------------------------------------------------------------------
# Datasource / JPA
# ---------------------------------------------------------------------
spring.datasource.url=${HIDRA_DATASOURCE_URL}
spring.datasource.username=${HIDRA_DATASOURCE_USERNAME}
spring.datasource.password=${HIDRA_DATASOURCE_PASSWORD}
spring.datasource.hikari.pool-name=HidraStagingHikariPool
spring.datasource.hikari.maximum-pool-size=${HIDRA_DATASOURCE_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIDRA_DATASOURCE_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoint.health.show-details=when_authorized
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.dz.sh.hidra=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# ---------------------------------------------------------------------
# OpenAPI
# ---------------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ---------------------------------------------------------------------
# Hidra custom properties
# ---------------------------------------------------------------------
hidra.environment=staging
hidra.platform.security.cors.allowed-origins=${HIDRA_CORS_ALLOWED_ORIGINS:}
hidra.platform.events.outbox.cleanup-enabled=false
hidra.platform.events.outbox.batch-size=${HIDRA_OUTBOX_BATCH_SIZE:50}
hidra.platform.events.outbox.max-retry-count=${HIDRA_OUTBOX_MAX_RETRY_COUNT:5}
hidra.api.errors.include-debug-details=false

# ---------------------------------------------------------------------
# Security bootstrap credentials
# ---------------------------------------------------------------------
hidra.security.bootstrap.username=${HIDRA_SECURITY_BOOTSTRAP_USERNAME:hidra-admin}
hidra.security.bootstrap.password=${HIDRA_SECURITY_BOOTSTRAP_PASSWORD:hidra-dev-change-me}
hidra.security.bootstrap.roles=${HIDRA_SECURITY_BOOTSTRAP_ROLES:HIDRA_ADMIN}
hidra.platform.security.authentication-mode=${HIDRA_SECURITY_AUTHENTICATION_MODE:jwt}
hidra.platform.security.jwt.issuer-uri=${HIDRA_JWT_ISSUER_URI:}
hidra.platform.security.jwt.jwk-set-uri=${HIDRA_JWT_JWK_SET_URI:}
hidra.platform.security.jwt.hmac-secret=${HIDRA_JWT_HMAC_SECRET:}
hidra.platform.security.jwt.audience=${HIDRA_JWT_AUDIENCE:hidra-api}

# ---------------------------------------------------------------------
# Notification asynchronous push
# ---------------------------------------------------------------------
hidra.notification.async-push.enabled=${HIDRA_NOTIFICATION_ASYNC_PUSH_ENABLED:true}
hidra.notification.async-push.core-pool-size=${HIDRA_NOTIFICATION_ASYNC_PUSH_CORE_POOL_SIZE:4}
hidra.notification.async-push.max-pool-size=${HIDRA_NOTIFICATION_ASYNC_PUSH_MAX_POOL_SIZE:12}
hidra.notification.async-push.queue-capacity=${HIDRA_NOTIFICATION_ASYNC_PUSH_QUEUE_CAPACITY:500}
hidra.notification.async-push.thread-name-prefix=${HIDRA_NOTIFICATION_ASYNC_PUSH_THREAD_PREFIX:HidraNotificationPush-}
hidra.notification.push.provider-reference=${HIDRA_NOTIFICATION_PUSH_PROVIDER_REFERENCE:hidra-local-async-push}

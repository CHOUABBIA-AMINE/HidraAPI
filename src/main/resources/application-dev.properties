# =====================================================================
# HidraAPI - Development profile
# Activate with:
#   SPRING_PROFILES_ACTIVE=dev
# =====================================================================

spring.config.activate.on-profile=dev

# ---------------------------------------------------------------------
# Datasource / JPA
# ---------------------------------------------------------------------
spring.datasource.url=${HIDRA_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hidra_dev}
spring.datasource.username=${HIDRA_DATASOURCE_USERNAME:hidra}
spring.datasource.password=${HIDRA_DATASOURCE_PASSWORD:hidra}
spring.datasource.hikari.pool-name=HidraDevHikariPool
spring.datasource.hikari.maximum-pool-size=${HIDRA_DATASOURCE_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIDRA_DATASOURCE_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.dz.sh.hidra=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------------------------------------------------------------------
# OpenAPI
# ---------------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ---------------------------------------------------------------------
# Hidra custom properties
# ---------------------------------------------------------------------
hidra.environment=dev
hidra.platform.security.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
hidra.platform.events.outbox.cleanup-enabled=false
hidra.api.errors.include-debug-details=true

name: AUTH-028 roadmap finalize

on:
  push:
    branches:
      - auth-028-authentication-deployment-runbook
    paths:
      - '.github/auth-028-finalize.sh'
      - '.github/workflows/auth-028-roadmap-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-028-authentication-deployment-runbook
          fetch-depth: 0
      - name: Finalize AUTH-028 roadmap
        run: bash .github/auth-028-finalize.sh

global
    log stdout format raw local0
    stats socket /run/haproxy/hidra-admin.sock mode 660 level admin

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h

frontend hidra_api
    bind ${HIDRA_API_BIND}
    acl hidra_realtime path_beg /api/v1/realtime/ws /api/v1/realtime/sse
    use_backend hidra_realtime if hidra_realtime
    default_backend hidra_rest

backend hidra_rest
    balance roundrobin
    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    server hidra-api-1 ${HIDRA_APP_NODE_1} check
    server hidra-api-2 ${HIDRA_APP_NODE_2} check

# P1 deliberately keeps realtime single-active. This backend does not claim HA.
backend hidra_realtime
    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    server hidra-api-1 ${HIDRA_APP_NODE_1} check
